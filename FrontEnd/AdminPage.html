            id="password"
            class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-yellow-500"
            placeholder="Enter password"
          />
        </div>
        <button
          onclick="handleLogin()"
          class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-2 rounded-lg transition-all"
        >
          Login

        <button

    <!-- 🔹 Script -->
    <script type="module" src="./AdminPage.js"></script>
    <script type="module">
      import { BackEndHostedURI } from "./BEURI.js";
      async function CheckAdminEmailAndPassFromDB() {
        var res = await fetch(`${BackEndHostedURI}/api/admin-login`, {
          method: "POST",
          headers: {
            "content-type": "application/json",
          },
          body: JSON.stringify({
            emailInput: document.getElementById("email").value.trim(),
            passwordInput: document.getElementById("password").value.trim(),
          }),
        });
        res = await res.json();
        console.log(res.success);
        if (res.success) {
          localStorage.setItem(
            "email",
            document.getElementById("email").value.trim(),
          );
          showAdminPage();
        } else {
          alert("Invalid email or password!");
        }
      }

      window.onload = function () {
        const email = localStorage.getItem("email");
        const password = localStorage.getItem("password");
        if (email != null) {
          showAdminPage();
        } else {
          document.getElementById("loginForm").classList.remove("hidden");
        }
      };

      window.handleLogin = function () {
        const emailInput = document.getElementById("email").value.trim();
        const passwordInput = document.getElementById("password").value.trim();

        if (!emailInput || !passwordInput) {
          alert("Please fill in both fields");
          return;
        }
        CheckAdminEmailAndPassFromDB();
      };

      window.showAdminPage = function () {
        document.getElementById("loginForm").classList.add("hidden");
        document.getElementById("adminPage").classList.remove("hidden");
      };

      window.logout = function () {
        localStorage.removeItem("email");
        location.reload();
      };

      window.handleSearchBtn = function () {
        const searchValue = document.getElementById("SearchValue").value.trim();
        alert("Search triggered: " + searchValue);
      };

      window.handleCencel = function () {
        window.location.href = "https://gulzarsonsfurniture.com/";
      };
    </script>
