<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider</title>

    <style>
      body {
        ::-webkit-scrollbar {
          width: 10px;
        }

        /* Track */
        ::-webkit-scrollbar-track {
          background: transparent;
        }

        /* Handle */
        ::-webkit-scrollbar-thumb {
          background: #F5AC3A;
          border-radius: 20px;
          cursor: pointer;
        }

        /* Handle on hover */
        ::-webkit-scrollbar-thumb:hover {
          background: #f97416a1;
        }
      }

      .MainReviewsContainer {
        font-family: Arial, sans-serif;
        background: #fff;
        margin: 0;
      }

      .review-marquee-row {
        width: 100%;
        margin: 0 auto;
        overflow: hidden;
        position: relative;
      }

      .review-gradient-left,
      .review-gradient-right {
        position: absolute;
        top: 0;
        height: 100%;
        width: 80px;
        z-index: 10;
        pointer-events: none;
      }

      .review-gradient-left {
        left: 0;
        background: linear-gradient(to right, white, transparent);
      }

      .review-gradient-right {
        right: 0;
        background: linear-gradient(to left, white, transparent);
      }

      .review-marquee-inner {
        display: flex;
        min-width: 200%;
        padding: 40px 0;
        animation: reviewMarqueeScroll 25s linear infinite;
        cursor: pointer;
      }

      .review-marquee-inner:hover {
        animation-play-state: paused;
      }

      .review-marquee-reverse {
        animation-direction: reverse;
      }

      @keyframes reviewMarqueeScroll {
        0% {
          transform: translateX(0%);
        }

        100% {
          transform: translateX(-50%);
        }
      }

      .review-card {
        width: 288px;
        margin: 0 16px;
        padding: 16px;
        border-radius: 12px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        transition: box-shadow 0.2s ease;
        flex-shrink: 0;
        background: #fff;
        height: 380px;
        overflow-y: scroll;
      }

      .review-card:hover {
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      }

      .review-card-header {
        display: flex;
        gap: 8px;
        justify-content: start;
        align-items: center;
      }

      .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
      }

      .user-info {
        display: flex;
        flex-direction: column;
      }

      .user-top {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: -8px;
      }

      .handle {
        font-size: 12px;
        color: #64748b;
        margin-top: -2px;
      }

      .review-text {
        font-size: 14px;
        padding: 16px 0;
        color: #1f2937;
      }

      .review-card-footer {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #64748b;
      }

      .footer-left {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
      }

      .footer-left a {
        color: inherit;
        text-decoration: none;
      }

      .footer-left a:hover {
        color: #0ea5e9;
      }

      .small-icon {
        margin-top: 2px;
      }
    </style>
  </head>
